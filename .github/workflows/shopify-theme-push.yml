name: Push Audio Upload Widget to Shopify Theme

on:
  workflow_dispatch:
    inputs:
      theme_password:
        description: 'Shopify Theme Access password (shptka_...)'
        required: true
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Push theme files to live theme
        working-directory: shopify
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ github.event.inputs.theme_password }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
          SHOPIFY_CLI_PARTNERS_TOKEN: ""
        run: |
          shopify theme push \
            --store pulse-heirloom-studios.myshopify.com \
            --live \
            --only "sections/audio-upload.liquid" \
            --only "assets/audio-upload.js" \
            --force

      - name: Done
        run: echo "Both files pushed to live theme"
